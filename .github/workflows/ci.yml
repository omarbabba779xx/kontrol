name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  OPA_VERSION: "1.4.2"

jobs:
  check:
    name: Lint, types, unit and integration tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Moto (AWS wire-protocol server for the collector tests)
        run: pip install "moto[server]"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Rego policies (syntax, strict check and unit tests)
        run: npm run test:opa
      - name: Tests (SQLite) including TypeScript/Rego parity against a real OPA
        run: npm test
      - name: Tests (PostgreSQL with row-level security)
        run: npm run test:postgres
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright, axe)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    name: Production image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kontrol:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image has no development packages
        run: test "$(docker run --rm --entrypoint sh kontrol:ci -c 'test -d node_modules/shadcn && echo present || echo absent')" = absent
      - name: Container starts in production on an empty database and reports health
        run: |
          docker run -d --name kontrol -p 3000:3000 \
            -e KONTROL_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e KONTROL_SIGNING_SECRET="$(openssl rand -hex 32)" \
            -e KONTROL_SIGNING_KEY="$(openssl genpkey -algorithm ed25519 | base64 -w0)" \
            -e KONTROL_SECRETS_KEY="$(openssl rand -hex 32)" \
            -e KONTROL_BOOTSTRAP_ADMIN_EMAIL=admin@example.org kontrol:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then echo "healthy"; break; fi
            sleep 2
          done
          # No demonstration data, and nothing is reachable without signing in.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/compliance)" = 401
          docker logs kontrol
          docker rm -f kontrol
