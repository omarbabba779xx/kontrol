<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Kontrol</title>
  <desc id="desc">Kontrol: an information security management system and GRC platform where every claim is backed by evidence you can verify.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9d4c8" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f1e9" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#f4f1e9" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f4f1e9" stop-opacity="0.35"/>
    </linearGradient>
    <style>
      .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="400" fill="#f4f1e9"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#fade)"/>
  <rect x="0" y="0" width="1280" height="6" fill="#171713"/>

  <!-- Wordmark -->
  <g transform="translate(72 96)">
    <rect x="0" y="4" width="44" height="44" fill="#171713"/>
    <path d="M13 14v24M13 26l14-12M18 22l11 16" stroke="#f4f1e9" stroke-width="4" fill="none" stroke-linecap="square"/>
    <rect x="34" y="38" width="10" height="10" fill="#f4673b"/>
    <text x="64" y="42" class="sans" font-size="46" font-weight="700" letter-spacing="-1.5" fill="#171713">Kontrol</text>
  </g>

  <text x="72" y="196" class="sans" font-size="30" font-weight="600" letter-spacing="-0.6" fill="#171713">Governance you can prove.</text>
  <text x="72" y="232" class="sans" font-size="18" fill="#55534b">An ISMS and GRC platform where every claim is backed by evidence,</text>
  <text x="72" y="258" class="sans" font-size="18" fill="#55534b">every decision is signed, and every gap is named.</text>

  <!-- Framework chips -->
  <g class="mono" font-size="12" font-weight="600" letter-spacing="0.6" fill="#171713">
    <g transform="translate(72 296)"><rect width="104" height="28" fill="none" stroke="#171713"/><text x="52" y="18.5" text-anchor="middle">ISO 27001</text></g>
    <g transform="translate(184 296)"><rect width="122" height="28" fill="none" stroke="#171713"/><text x="61" y="18.5" text-anchor="middle">NIST CSF 2.0</text></g>
    <g transform="translate(314 296)"><rect width="122" height="28" fill="none" stroke="#171713"/><text x="61" y="18.5" text-anchor="middle">NIST 800-30</text></g>
    <g transform="translate(444 296)"><rect width="110" height="28" fill="none" stroke="#171713"/><text x="55" y="18.5" text-anchor="middle">COBIT 2019</text></g>
    <g transform="translate(562 296)"><rect width="66" height="28" fill="none" stroke="#171713"/><text x="33" y="18.5" text-anchor="middle">SOC 2</text></g>
    <g transform="translate(72 332)"><rect width="58" height="28" fill="none" stroke="#171713"/><text x="29" y="18.5" text-anchor="middle">NIS2</text></g>
    <g transform="translate(138 332)"><rect width="58" height="28" fill="none" stroke="#171713"/><text x="29" y="18.5" text-anchor="middle">DORA</text></g>
    <g transform="translate(204 332)"><rect width="58" height="28" fill="none" stroke="#171713"/><text x="29" y="18.5" text-anchor="middle">GDPR</text></g>
    <g transform="translate(270 332)"><rect width="86" height="28" fill="none" stroke="#171713"/><text x="43" y="18.5" text-anchor="middle">EU AI Act</text></g>
    <g transform="translate(364 332)"><rect width="100" height="28" fill="none" stroke="#171713"/><text x="50" y="18.5" text-anchor="middle">ISO 42001</text></g>
    <g transform="translate(472 332)"><rect width="76" height="28" fill="none" stroke="#171713"/><text x="38" y="18.5" text-anchor="middle">PCI DSS</text></g>
    <g transform="translate(556 332)"><rect width="72" height="28" fill="none" stroke="#171713"/><text x="36" y="18.5" text-anchor="middle">CIS v8</text></g>
  </g>

  <!-- The chain: risk to control to evidence to signed decision -->
  <g transform="translate(724 64)">
    <path d="M86 46v34M86 156v34M86 266v20" stroke="#171713" stroke-width="2" fill="none"/>
    <path d="M178 118h56M178 228h56" stroke="#171713" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

    <g class="mono">
      <rect x="0" y="0" width="172" height="46" fill="#171713"/>
      <text x="14" y="19" font-size="10" fill="#9c998f" letter-spacing="1.2">RISK · NIST 800-30</text>
      <text x="14" y="36" font-size="13" fill="#f4f1e9">RSK-014  High → Low</text>

      <rect x="0" y="80" width="172" height="76" fill="#fbfaf6" stroke="#171713" stroke-width="1.5"/>
      <text x="14" y="100" font-size="10" fill="#63615a" letter-spacing="1.2">CONTROL</text>
      <text x="14" y="120" font-size="13" fill="#171713">UC-IAM-02  MFA</text>
      <rect x="14" y="132" width="96" height="14" fill="#dcebe1"/>
      <text x="20" y="143" font-size="9.5" fill="#245c3f" letter-spacing="0.8">VERIFIED · N4</text>

      <rect x="0" y="190" width="172" height="76" fill="#fbfaf6" stroke="#171713" stroke-width="1.5"/>
      <text x="14" y="210" font-size="10" fill="#63615a" letter-spacing="1.2">EVIDENCE · GITHUB</text>
      <text x="14" y="230" font-size="13" fill="#171713">sha256 81ce…220f</text>
      <text x="14" y="252" font-size="10" fill="#63615a">integrity verified</text>

      <rect x="0" y="286" width="172" height="40" fill="#f4673b"/>
      <text x="14" y="311" font-size="12" fill="#171713" font-weight="600">DECISION · SIGNED</text>
    </g>

    <g class="mono">
      <rect x="234" y="96" width="250" height="44" fill="#fbfaf6" stroke="#cbc7bd"/>
      <text x="248" y="114" font-size="10" fill="#63615a" letter-spacing="1.2">SATISFIES</text>
      <text x="248" y="131" font-size="12" fill="#171713">ISO A8.5 · CSF PR.AA · DSS05</text>

      <rect x="234" y="206" width="250" height="44" fill="#fbfaf6" stroke="#cbc7bd"/>
      <text x="248" y="224" font-size="10" fill="#63615a" letter-spacing="1.2">ANCHORED</text>
      <text x="248" y="241" font-size="12" fill="#171713">audit chain · Object Lock</text>
    </g>

    <g class="mono" transform="translate(234 286)">
      <rect width="250" height="40" fill="#171713"/>
      <text x="14" y="17" font-size="10" fill="#9c998f" letter-spacing="1.2">ISMS · CLAUSES 4–10</text>
      <rect x="14" y="24" width="14" height="8" fill="#5fa37f"/><rect x="31" y="24" width="14" height="8" fill="#5fa37f"/><rect x="48" y="24" width="14" height="8" fill="#5fa37f"/><rect x="65" y="24" width="14" height="8" fill="#5fa37f"/><rect x="82" y="24" width="14" height="8" fill="#5fa37f"/><rect x="99" y="24" width="14" height="8" fill="#5fa37f"/><rect x="116" y="24" width="14" height="8" fill="#d8b45a"/><rect x="133" y="24" width="14" height="8" fill="#5fa37f"/><rect x="150" y="24" width="14" height="8" fill="#5fa37f"/><rect x="167" y="24" width="14" height="8" fill="#d8b45a"/><rect x="184" y="24" width="14" height="8" fill="#5fa37f"/><rect x="201" y="24" width="14" height="8" fill="#5fa37f"/><rect x="218" y="24" width="14" height="8" fill="#e27a6b"/>
    </g>
  </g>
</svg>
