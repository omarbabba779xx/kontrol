services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kontrol
      POSTGRES_USER: kontrol
      POSTGRES_PASSWORD: kontrol
    ports: ["5432:5432"]
    volumes:
      - kontrol-postgres:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontrol"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kontrol
      MINIO_ROOT_PASSWORD: change-me-now
    ports: ["9000:9000", "9001:9001"]
    volumes: ["kontrol-evidence:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 kontrol change-me-now; do sleep 2; done;
        mc mb --ignore-existing local/kontrol-evidence;
        mc version enable local/kontrol-evidence;
        mc retention set --default GOVERNANCE 365d local/kontrol-evidence;
        exit 0
  opa:
    image: openpolicyagent/opa:1.4.2-static
    command: run --server --addr=0.0.0.0:8181 /policies
    ports: ["8181:8181"]
    volumes: ["./infra/opa:/policies:ro"]
volumes:
  kontrol-postgres:
  kontrol-evidence:
